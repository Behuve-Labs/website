name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

# Avoid overlapping deploys: a newer push cancels an in-flight one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No Node/npm setup: the site is static HTML/CSS/JS and the Pages
      # Functions have zero npm dependencies (all imports are relative .js).
      # cloudflare/wrangler-action installs its own pinned wrangler and
      # bundles the functions/ directory during `pages deploy`.

      - name: Check secrets are present
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "API token length: ${#API_TOKEN}"
          echo "Account ID length: ${#ACCOUNT_ID}"
          if [ -z "$API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is empty or missing"
            exit 1
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is empty or missing"
            exit 1
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.95.0"
          command: pages deploy . --project-name=behuve-research --branch=main
